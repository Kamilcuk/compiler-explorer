---
- name: Create /dev/null_ce device node
  ansible.builtin.command:
    cmd: mknod -m 0666 /dev/null_ce c 1 3
    creates: /dev/null_ce

- name: Set ownership of /dev/null_ce to ce user
  ansible.builtin.file:
    path: /dev/null_ce
    owner: "1000"
    group: "1000"
    mode: "0666"

- name: Install tmpfiles config for /dev/null_ce persistence across reboots
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/ce-devnull.conf
    mode: "0644"
    content: |
      c! /dev/null_ce 0666 1000 1000 1:3