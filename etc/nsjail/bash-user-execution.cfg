name: "compiler explorer bash execution sandbox"

mode: ONCE
hostname: "ce"

time_limit: 0

log_level: ERROR

rlimit_as_type: INF
rlimit_cpu_type: SOFT
rlimit_fsize: 1024 # 1GB
rlimit_nofile: 300
rlimit_nproc: 64

uidmap {
    inside_id: "10240"
}

gidmap {
    inside_id: "10240"
}

detect_cgroupv2: true

cgroupv2_mount: "/sys/fs/cgroup/ce-sandbox"

mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
}

mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
}

mount {
    src: "/usr/local/lib"
    dst: "/usr/local/lib"
    is_bind: true
}

mount {
    src: "/usr/share/zoneinfo"
    dst: "/usr/share/zoneinfo"
    is_bind: true
}

mount {
    src: "/etc/localtime"
    dst: "/etc/localtime"
    is_bind: true
}
mount {
    src_content: "ce:x:10240:10240:Not a real account:/app:/bin/bash"
    dst: "/etc/passwd"
    is_bind: true
}
mount {
    src_content: "ce:$1$rockyou$hty8SH9lK4mcCQXKENxaa1:18723:0:99999:7:::"
    dst: "/etc/shadow"
    is_bind: true
}

mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    mandatory: false
}

mount {
    dst: "/tmp"
    fstype: "tmpfs"
    options: "size=20971520,nr_inodes=100"
    rw: true
    noexec: true
    nodev: true
    nosuid: true
}

mount {
    dst: "/dev"
    fstype: "tmpfs"
}

mount {
    src: "/dev/null_ce"
    dst: "/dev/null"
    rw: true
    is_bind: true
}

mount {
    src: "/dev/zero"
    dst: "/dev/zero"
    is_bind: true
}

mount {
    src: "/dev/urandom"
    dst: "/dev/random"
    is_bind: true
}

mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
}

mount {
    src: "/usr/bin/bash"
    dst: "/usr/bin/bash"
    is_bind: true
}

mount {
    src: "/usr/bin/cat"
    dst: "/usr/bin/cat"
    is_bind: true
}

mount {
    src: "/usr/bin/stat"
    dst: "/usr/bin/stat"
    is_bind: true
}

mount {
    src: "/usr/bin/env"
    dst: "/usr/bin/env"
    is_bind: true
}

mount {
    src: "/usr/bin/basename"
    dst: "/usr/bin/basename"
    is_bind: true
}

mount {
    src: "/usr/bin/dirname"
    dst: "/usr/bin/dirname"
    is_bind: true
}

mount {
    src: "/usr/bin/date"
    dst: "/usr/bin/date"
    is_bind: true
}

mount {
    src: "/usr/bin/grep"
    dst: "/usr/bin/grep"
    is_bind: true
}

mount {
    src: "/usr/bin/wc"
    dst: "/usr/bin/wc"
    is_bind: true
}

mount {
    src: "/usr/bin/sort"
    dst: "/usr/bin/sort"
    is_bind: true
}

mount {
    src: "/usr/bin/cut"
    dst: "/usr/bin/cut"
    is_bind: true
}

mount {
    src: "/usr/bin/tr"
    dst: "/usr/bin/tr"
    is_bind: true
}

mount {
    src: "/usr/bin/uniq"
    dst: "/usr/bin/uniq"
    is_bind: true
}

mount {
    src: "/usr/bin/mkdir"
    dst: "/usr/bin/mkdir"
    is_bind: true
}

mount {
    src: "/usr/bin/readlink"
    dst: "/usr/bin/readlink"
    is_bind: true
}

mount {
    src: "/usr/bin/mktemp"
    dst: "/usr/bin/mktemp"
    is_bind: true
}

mount {
    src: "/opt/compiler-explorer/etc/scripts/bash-runner.sh"
    dst: "/opt/compiler-explorer/etc/scripts/bash-runner.sh"
    is_bind: true
}

mount {
    src: "/mnt/compiler-explorer/MYSTUFF/libs/L_lib"
    dst: "/mnt/compiler-explorer/MYSTUFF/libs/L_lib"
    is_bind: true
    rw: false
}

seccomp_string: "POLICY ce_bash_execution {"
seccomp_string: "    ALLOW {"
seccomp_string: "        execve, brk, mmap, munmap, mprotect, mremap, arch_prctl,"
seccomp_string: "        access, open, openat,"
seccomp_string: "        newfstatat, newfstat, newlstat, newstat, readlink, readlinkat,"
seccomp_string: "        read, pread64, write, writev, readv, pwrite64,"
seccomp_string: "        close, lseek,"
seccomp_string: "        getdents64,"
seccomp_string: "        getcwd, chdir, fchdir,"
seccomp_string: "        dup, dup2, dup3, pipe, pipe2, fcntl, ioctl,"
seccomp_string: "        poll, ppoll, select, pselect6,"
seccomp_string: "        unlink, unlinkat, rmdir, mkdir, mkdirat,"
seccomp_string: "        rename, renameat,"
seccomp_string: "        chmod, fchmod, chown, fchown, umask,"
seccomp_string: "        truncate, ftruncate,"
seccomp_string: "        clone, fork, vfork,"
seccomp_string: "        wait4, waitid,"
seccomp_string: "        exit_group,"
seccomp_string: "        rt_sigaction, rt_sigprocmask, sigaltstack, gettid, futex,"
seccomp_string: "        set_tid_address, set_robust_list, prlimit64,"
seccomp_string: "        rt_sigreturn,"
seccomp_string: "        clock_gettime, getrandom, nanosleep,"
seccomp_string: "        getegid, geteuid, getgid, getuid, getpid, getppid, getpgrp,"
seccomp_string: "        tkill, tgkill, kill,"
seccomp_string: "        madvise, prctl,"
seccomp_string: "        capget"
seccomp_string: "    }"
seccomp_string: "}"
seccomp_string: "USE ce_bash_execution DEFAULT ERRNO(1)"
