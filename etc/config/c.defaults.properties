# Default settings for C
compilers=yio_gcc
defaultCompiler=yio_gcc
demangler=c++filt
objdumper=objdump
postProcess=
supportsBinary=true
supportsBinaryObject=true
binaryHideFuncRe=^(__.*|_(init|start|fini)|(de)?register_tm_clones|call_gmon_start|frame_dummy|\.plt.*)$
stubRe=\bmain\b
stubText=int main(void){return 0;/*stub provided by Compiler Explorer*/}
supportsLibraryCodeFilter=true

# YIO COMPILER CONFIG
# Global defaults for C++ (used as the base language for Yio)
defaultSource=etc/examples/yio_example.c

# compilers=yio_gcc:yio_clang:yio_arm:yio_stm8
compilers=yio_gcc
defaultCompiler=yio_gcc

compiler.yio_gcc.exe=/usr/bin/gcc
compiler.yio_gcc.name=GCC (with Yio)
compiler.yio_gcc.options=-O2 -fplugin=/usr/local/lib/yio_gcc_fstring_plugin.so -Wl,--no-as-needed -Wl,--whole-archive -lm -lyio -lunistring -Wl,--no-whole-archive -ffunction-sections -fdata-sections  -Wl,--gc-sections

# compiler.yio_clang.exe=/usr/bin/clang
# compiler.yio_clang.name=Clang (with Yio)
# compiler.yio_clang.options=-O2 -fplugin=/usr/local/lib/yio_clang_fstring_plugin.so -lyio -lunistring
#
# compiler.yio_arm.exe=/usr/bin/arm-none-eabi-gcc
# compiler.yio_arm.name=ARM GCC (with Yio)
# compiler.yio_arm.options=-mthumb -mcpu=cortex-m3 -mfloat-abi=soft -Os -ffunction-sections -fdata-sections -ggdb3 -Wl,--no-as-needed -lyio --specs=rdimon.specs --specs=nosys.specs -u_printf_float -Wl,--gc-sections

